[project]
name = "grabbr"
dynamic = ["version"]
description = "Paste a YouTube or SoundCloud link, get an MP3."
requires-python = ">=3.10"
dependencies = ["customtkinter>=5.2,<6"]

[project.scripts]
grabbr = "grabbr.app:main"

[tool.setuptools.dynamic]
version = { attr = "grabbr.__version__" }

[tool.setuptools]
packages = ["grabbr"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
